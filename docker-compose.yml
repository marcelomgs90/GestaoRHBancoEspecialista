version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gestao_rh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestao_rh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao_rh_pass}
      POSTGRES_DB: ${POSTGRES_DB:-gestao_rh_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestao_rh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: gestao_rh_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestao_rh}:${POSTGRES_PASSWORD:-gestao_rh_pass}@db:5432/${POSTGRES_DB:-gestao_rh_db}
      SECRET_KEY: ${SECRET_KEY:-sua-chave-secreta-aqui}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BANCO_ESPECIALISTAS_URL: ${BANCO_ESPECIALISTAS_URL:-https://api.bancoespecialistas.ifpb.edu.br}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: gestao_rh_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
