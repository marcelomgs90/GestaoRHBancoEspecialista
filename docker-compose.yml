version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gestao_rh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestao_rh
      POSTGRES_PASSWORD: gestao_rh_pass
      POSTGRES_DB: gestao_rh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_rh"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: gestao_rh_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gestao_rh:gestao_rh_pass@db:5432/gestao_rh_db
      SECRET_KEY: chave-secreta-producao-super-segura-mgs
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BANCO_ESPECIALISTAS_URL: https://api.bancoespecialistas.ifpb.edu.br
      PYDANTIC_CONFIG_EXTRA: allow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao_rh_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
